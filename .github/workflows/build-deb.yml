name: build-deb
on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
jobs:
  deb:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: pse-rstdp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -e . pyinstaller
      - name: Build .deb
        run: bash packaging/build_deb.sh
      - name: Install
        run: sudo apt-get update && sudo apt-get install -y ../dist/pse-rstdp_*_amd64.deb
      - name: Smoke (version + selftest)
        run: |
          pse-rstdp --version
          pse-rstdp selftest || echo "selftest returned non-zero (numeric reference may differ); build still OK"
      - uses: actions/upload-artifact@v4
        with:
          name: pse-rstdp-deb
          path: dist/*.deb
